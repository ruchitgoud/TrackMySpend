<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff">
    <title>TrackMySpend - React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Reset & Base */
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          -webkit-user-select: none; /* Disable selection globally */
          user-select: none;
        }

        /* Re-enable selection for inputs and interactive fields */
        input, textarea, [contenteditable="true"] {
          -webkit-user-select: text;
          user-select: text;
        }

        body {
          font-family: 'Outfit', sans-serif;
          background-color: transparent;
          color: #111;
          line-height: 1.5;
          display: flex;
          justify-content: center;
          padding: 20px;
          min-height: 100vh;
          -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on Android */
        }

        /* Interactive elements native feel */
        button, .back-btn, .menu-btn, .tx-card {
          touch-action: manipulation; /* Removes tap delay on mobile */
        }

        /* Main App Container */
        main {
          background-color: #fff;
          width: 100%;
          max-width: 420px; /* Mobile app size */
          border: 3px solid #000;
          border-radius: 32px;
          padding: 24px;
          box-shadow: 8px 8px 0px #000;
          position: relative;
          overflow-x: hidden;
        }

        /* Header matching the image's top bar */
        header {
          display: flex;
          align-items: center;
          margin-bottom: 24px;
          gap: 16px;
          justify-content: space-between;
          position: relative;
        }

        .back-btn {
          width: 40px;
          height: 40px;
          border: 3px solid #000;
          border-radius: 12px;
          background-color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 3px 3px 0px #000;
          cursor: pointer;
          transition: all 0.1s ease;
        }

        .back-btn:active {
          box-shadow: 0px 0px 0px #000;
          transform: translate(3px, 3px);
        }

        header h1 {
          font-size: 1.4em;
          font-weight: 700;
          flex: 1;
          text-align: center;
        }

        /* Overflow Menu & Dropdown */
        .menu-btn {
          width: 40px;
          height: 40px;
          border: 3px solid #000;
          border-radius: 12px;
          background-color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 3px 3px 0px #000;
          cursor: pointer;
          transition: all 0.1s ease;
        }

        .menu-btn:active {
          box-shadow: 0px 0px 0px #000;
          transform: translate(3px, 3px);
        }

        .dropdown-menu {
          display: none;
          position: absolute;
          top: 50px;
          right: 0;
          background-color: #fff;
          border: 3px solid #000;
          border-radius: 16px;
          box-shadow: 4px 4px 0px #000;
          z-index: 100;
          flex-direction: column;
          overflow: hidden;
          min-width: 140px;
        }

        .dropdown-menu.show {
          display: flex;
        }

        .dropdown-menu button {
          background: none;
          border: none;
          border-bottom: 3px solid #000;
          padding: 12px 16px;
          font-family: 'Outfit', sans-serif;
          font-weight: 700;
          font-size: 1em;
          text-align: left;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .dropdown-menu button:last-child {
          border-bottom: none;
        }

        .dropdown-menu button:hover {
          background-color: #f4e8f9;
        }

        /* Summary Section Grid */
        .summary {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          margin-bottom: 32px;
        }

        .summary-box {
          border: 3px solid #000;
          border-radius: 20px;
          padding: 16px;
          box-shadow: 4px 4px 0px #000;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        .summary-box h3 {
          font-size: 0.9em;
          font-weight: 600;
          margin-bottom: 4px;
          opacity: 0.9;
        }

        .summary-box p {
          font-size: 1.4em;
          font-weight: 800;
          }

        .box-balance {
          grid-column: span 2;
          background-color: #FEF3C7; /* Soft yellow */
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
          padding: 20px 24px;
          border-radius: 24px;
        }

        .box-balance .pill {
          background-color: #FFC98B; /* Peach */
          padding: 6px 16px;
          border-radius: 999px;
          border: 2px solid #000;
          font-weight: 700;
          font-size: 0.85em;
          box-shadow: 2px 2px 0px #000;
        }

        .box-income { background-color: #D1EAE5; } /* Mint */
        .box-expense { background-color: #FEE2E2; } /* Light pink */

        /* View Mode Toggle */
        .view-mode-toggle {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            margin-bottom: -4px;
        }

        .view-mode-toggle button {
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 4px 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.8em;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.1s;
        }

        .view-mode-toggle button:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(2px, 2px);
        }

        /* Transaction Form */
        .transaction-form {
          margin-bottom: 32px;
        }

        .transaction-form h2 {
          font-size: 1.2em;
          font-weight: 700;
          margin-bottom: 12px;
        }

        .transaction-form label {
          display: none; /* Hide labels for a cleaner look, use placeholders */
        }

        .input-group {
          display: flex;
          gap: 12px;
          margin-bottom: 12px;
        }

        .transaction-form input,
        .transaction-form select {
          width: 100%;
          padding: 14px 16px;
          margin-bottom: 12px;
          border: 3px solid #000;
          border-radius: 16px;
          font-size: 1em;
          font-family: 'Outfit', sans-serif;
          font-weight: 600;
          background-color: #fff;
          transition: all 0.2s;
        }

        .transaction-form input:focus,
        .transaction-form select:focus {
          outline: none;
          box-shadow: 4px 4px 0px #000;
          transform: translate(-2px, -2px);
        }

        .transaction-form button {
          width: 100%;
          background-color: #FFC98B; /* Peach color matching the image */
          color: #000;
          border: 3px solid #000;
          padding: 16px;
          border-radius: 9999px; /* Pill shape */
          cursor: pointer;
          font-size: 1.1em;
          font-weight: 800;
          box-shadow: 4px 4px 0px #000;
          transition: all 0.1s ease-in-out;
          margin-top: 8px;
        }

        .transaction-form button:active {
          box-shadow: 0px 0px 0px #000;
          transform: translate(4px, 4px);
        }

        /* Transactions List */
        .transactions h2 {
          font-size: 1.2em;
          font-weight: 700;
          margin-bottom: 16px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .tx-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .tx-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          border: 3px solid #000;
          border-radius: 16px;
          padding: 16px;
          background-color: #fff;
          box-shadow: 3px 3px 0px #000;
          transition: transform 0.2s;
        }

        .tx-card:hover {
          transform: translateX(-2px) translateY(-2px);
          box-shadow: 5px 5px 0px #000;
        }

        .tx-info {
          display: flex;
          flex-direction: column;
        }

        .tx-title {
          font-weight: 700;
          font-size: 1.05em;
        }

        .tx-date {
          font-size: 0.8em;
          color: #666;
          font-weight: 600;
          margin-top: 2px;
        }

        .tx-right {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .tx-amount {
          font-weight: 800;
          font-size: 1.1em;
        }

        .tx-amount.income {
          color: #059669; /* Dark green */
        }

        .tx-amount.expense {
          color: #DC2626; /* Dark red */
        }

        .delete-btn {
          background-color: #FEE2E2;
          border: 2px solid #000;
          color: #000;
          width: 32px;
          height: 32px;
          border-radius: 10px;
          cursor: pointer;
          font-weight: bold;
          box-shadow: 2px 2px 0px #000;
          transition: all 0.1s;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .delete-btn:active {
          box-shadow: 0px 0px 0px #000;
          transform: translate(2px, 2px);
        }

        /* Empty state */
        .empty-state {
          text-align: center;
          padding: 20px;
          font-weight: 600;
          color: #666;
          border: 3px dashed #ccc;
          border-radius: 16px;
        }

        /* --- Views System --- */
        .view {
          display: none;
          flex-direction: column;
          min-height: 600px; /* Gives the app a consistent mobile height */
          animation: fadeIn 0.3s ease-in-out;
        }

        .view.active {
          display: flex;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* --- Landing Page Styles --- */
        #landing-view {
          align-items: center;
          text-align: center;
          padding: 20px 0;
        }

        .landing-content {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          width: 100%;
        }

        .hero-title {
          font-size: 4em;
          font-weight: 800;
          line-height: 1.1;
          margin-bottom: 40px;
          text-transform: uppercase;
          letter-spacing: -2px;
        }

        .get-started-btn {
          background-color: #D1EAE5; /* Mint green */
          color: #000;
          border: 3px solid #000;
          padding: 16px 40px;
          border-radius: 9999px;
          cursor: pointer;
          font-size: 1.3em;
          font-weight: 800;
          box-shadow: 6px 6px 0px #000;
          transition: all 0.1s ease-in-out;
        }

        .get-started-btn:active {
          box-shadow: 0px 0px 0px #000;
          transform: translate(6px, 6px);
        }

        .landing-desc {
          margin-top: 24px;
          font-size: 1.1em;
          font-weight: 600;
          color: #333;
          max-width: 85%;
          line-height: 1.4;
        }

        .watermark {
          margin-top: 40px;
          font-weight: 700;
          color: #888;
          font-size: 0.9em;
          border: 2px dashed #ccc;
          padding: 10px 20px;
          border-radius: 999px;
        }

        /* --- Custom Dialog Styles --- */
        .dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dialog-overlay.show {
            display: flex;
        }

        .dialog-content {
            background-color: #fff;
            border: 3px solid #000;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 8px 8px 0px #000;
            text-align: center;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dialog-content h3 {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .dialog-content p {
            font-weight: 600;
            color: #666;
            margin-bottom: 24px;
        }

        .dialog-actions {
            display: flex;
            gap: 12px;
        }

        .dialog-actions button {
            flex: 1;
            padding: 12px;
            border: 3px solid #000;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.1s;
        }

        .confirm-btn {
            background-color: #FEE2E2;
            box-shadow: 3px 3px 0px #000;
        }

        .confirm-btn:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(3px, 3px);
        }

        .cancel-btn {
            background-color: #fff;
            box-shadow: 3px 3px 0px #000;
        }

        .cancel-btn:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(3px, 3px);
        }

        /* --- Mobile & Android Specific Overrides --- */
        @media (max-width: 480px) {
          body {
            padding: 0; /* Remove padding on mobile */
            background-color: #fff; /* Match app background */
          }
          main {
            max-width: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available; /* Fills mobile browsers completely */
            border: none; /* Remove border to look like native app */
            border-radius: 0;
            box-shadow: none;
            padding: 20px 16px;
          }
          .view {
            min-height: calc(100vh - 40px);
          }
        }

    </style>
</head>
<body>

<main>
    <!-- Landing View -->
    <div id="landing-view" class="view active">
        <div class="landing-content">
            <h1 class="hero-title">Track<br>My<br>Spend</h1>
            <button class="get-started-btn" onclick="startApp()">Get Started</button>
            <p class="landing-desc">A Lightweight Expense Tracker App to Monitor Spending.</p>
        </div>
        <div class="watermark">Designed by Ruchit Goud</div>
    </div>

    <!-- Tracker View -->
    <div id="tracker-view" class="view">
        <header>
            <!-- Mock Back Button like in the design -->
            <div class="back-btn" onclick="goHome()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </div>
            <h1>Track My Spend</h1>

            <!-- Overflow Menu Button -->
            <button class="menu-btn" id="menuBtn" title="More Options">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
            </button>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu" id="dropdownMenu">
                <button id="exportBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Export
                </button>
                <button id="importBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Import
                </button>
            </div>
            <!-- Hidden file input for importing CSV -->
            <input type="file" id="fileInput" accept=".csv,text/csv,text/comma-separated-values" style="display: none;" />
        </header>

        <!-- Budget Summary -->
        <section class="summary">
            <div class="view-mode-toggle">
                <button id="toggleViewBtn">Showing: Total</button>
            </div>
            <div class="summary-box box-balance">
                <div>
                    <h3 id="label-balance">Net Balance</h3>
                    <p id="net-balance">₹0.00</p>
                </div>
                <div class="pill">Balance</div>
            </div>
            <div class="summary-box box-income">
                <h3 id="label-income">Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="summary-box box-expense">
                <h3 id="label-expense">Total Expenses</h3>
                <p id="total-expense">₹0.00</p>
            </div>
        </section>

        <!-- Transaction Form -->
        <section class="transaction-form">
            <h2>Add New</h2>
            <form id="transaction-form">
                <input
                        type="date"
                        id="date"
                        required
                />
                <input
                        type="text"
                        id="description"
                        required
                        placeholder="What was it for?"
                />

                <div class="input-group">
                    <input
                            type="number"
                            id="amount"
                            required
                            placeholder="₹ Amount"
                            step="0.01"
                            style="flex: 2;"
                    />
                    <select id="type" style="flex: 1;">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <!-- Transaction List -->
        <section class="transactions">
            <h2>Transactions</h2>
            <div class="tx-list" id="transaction-list">
                <!-- Transactions will be dynamically added here -->
            </div>
        </section>
    </div> <!-- End of Tracker View -->
</main>

<!-- Delete Confirmation Dialog -->
<div id="deleteDialog" class="dialog-overlay">
    <div class="dialog-content">
        <h3>Delete Transaction?</h3>
        <p>This action cannot be undone.</p>
        <div class="dialog-actions">
            <button class="cancel-btn" id="cancelDelete">No</button>
            <button class="confirm-btn" id="confirmDelete">Yes</button>
        </div>
    </div>
</div>

<script>
    // Robust Local Storage logic with a unique key and error handling
    let transactions = [];
    let viewMode = 'total'; // 'total' or 'monthly'

    try {
      let savedData = localStorage.getItem('trackMySpend_transactions_v1');

      // Migration from old generic key if it exists to prevent data loss
      if (!savedData && localStorage.getItem('transactions')) {
        savedData = localStorage.getItem('transactions');
        localStorage.setItem('trackMySpend_transactions_v1', savedData);
        localStorage.removeItem('transactions');
      }

      if (savedData) {
        transactions = JSON.parse(savedData);
      }
    } catch (e) {
      console.error("Error loading saved data: ", e);
      transactions = [];
    }

    // Helper function to format numbers as currency.
    function formatCurrency(amount) {
      return '₹' + amount.toFixed(2);
    }

    // Save the current transactions array to localStorage securely.
    function saveTransactions() {
      try {
        localStorage.setItem('trackMySpend_transactions_v1', JSON.stringify(transactions));
      } catch (e) {
        console.error("Error saving data: ", e);
      }
    }

    // Function to update summary values.
    function updateSummary() {
      let totalIncome = 0,
          totalExpense = 0;

      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      transactions.forEach(tx => {
        const txDate = new Date(tx.date);
        const isThisMonth = txDate.getMonth() === currentMonth && txDate.getFullYear() === currentYear;

        if (viewMode === 'total' || isThisMonth) {
            if (tx.type === 'income') {
              totalIncome += tx.amount;
            } else {
              totalExpense += tx.amount;
            }
        }
      });

      document.getElementById('total-income').textContent = formatCurrency(totalIncome);
      document.getElementById('total-expense').textContent = formatCurrency(totalExpense);
      document.getElementById('net-balance').textContent = formatCurrency(totalIncome - totalExpense);

      // Update Labels
      const prefix = viewMode === 'total' ? 'Total' : 'Monthly';
      document.getElementById('label-income').textContent = `${prefix} Income`;
      document.getElementById('label-expense').textContent = `${prefix} Expenses`;
      document.getElementById('label-balance').textContent = `Net ${prefix} Balance`;
      document.getElementById('toggleViewBtn').textContent = `Showing: ${prefix}`;
    }

    // Toggle View Mode Logic
    document.getElementById('toggleViewBtn').addEventListener('click', () => {
        viewMode = viewMode === 'total' ? 'monthly' : 'total';
        updateSummary();
    });

    let itemToDelete = null;
    const deleteDialog = document.getElementById('deleteDialog');

    function showDeleteConfirm(index) {
        itemToDelete = index;
        deleteDialog.classList.add('show');
    }

    document.getElementById('cancelDelete').addEventListener('click', () => {
        itemToDelete = null;
        deleteDialog.classList.remove('show');
    });

    document.getElementById('confirmDelete').addEventListener('click', () => {
        if (itemToDelete !== null) {
            transactions.splice(itemToDelete, 1);
            saveTransactions();
            renderTransactions();
            updateSummary();
            itemToDelete = null;
        }
        deleteDialog.classList.remove('show');
    });

    // Function to render the transactions as cards.
    function renderTransactions() {
      const listContainer = document.getElementById('transaction-list');
      listContainer.innerHTML = ''; // Clear previous items

      if(transactions.length === 0) {
          listContainer.innerHTML = '<div class="empty-state">No transactions yet!</div>';
          return;
      }

      // Sort transactions by date: newest first, oldest last.
      const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

      sortedTransactions.forEach((tx) => {
        // Find the original index for deletion
        const originalIndex = transactions.indexOf(tx);

        const card = document.createElement('div');
        card.className = 'tx-card';

        // Info side (Description & Date)
        const infoDiv = document.createElement('div');
        infoDiv.className = 'tx-info';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'tx-title';
        titleSpan.textContent = tx.description;

        const dateSpan = document.createElement('span');
        dateSpan.className = 'tx-date';
        dateSpan.textContent = new Date(tx.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

        infoDiv.appendChild(titleSpan);
        infoDiv.appendChild(dateSpan);

        // Right side (Amount & Delete)
        const rightDiv = document.createElement('div');
        rightDiv.className = 'tx-right';

        const amountSpan = document.createElement('span');
        amountSpan.className = `tx-amount ${tx.type}`;
        amountSpan.textContent = (tx.type === 'income' ? '+' : '-') + formatCurrency(tx.amount);

        const deleteBtn = document.createElement('button');
        deleteBtn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        `;
        deleteBtn.className = 'delete-btn';
        deleteBtn.addEventListener('click', () => {
            showDeleteConfirm(originalIndex);
        });

        rightDiv.appendChild(amountSpan);
        rightDiv.appendChild(deleteBtn);

        // Assemble card
        card.appendChild(infoDiv);
        card.appendChild(rightDiv);

        listContainer.appendChild(card);
      });
    }

    // Handle form submission for adding a new transaction.
    document.getElementById('transaction-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const dateValue = document.getElementById('date').value;
      const description = document.getElementById('description').value.trim();
      const amountValue = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;

      if (!description || isNaN(amountValue) || !dateValue) {
        alert('Please enter valid details.');
        return;
      }

      // Create a transaction object.
      // Appending T12:00:00 avoids timezone shift issues where the date might jump back a day.
      const transaction = {
        description: description,
        amount: amountValue,
        type: type,
        date: new Date(dateValue + 'T12:00:00').toISOString()
      };

      transactions.push(transaction);
      saveTransactions();
      renderTransactions();
      updateSummary();

      // Clear form inputs and reset date to today.
      this.reset();
      document.getElementById('date').valueAsDate = new Date();
    });

    // --- Export & Import Logic ---

    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const fileInput = document.getElementById('fileInput');

    // Toggle dropdown menu
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target) && !menuBtn.contains(e.target)) {
        dropdownMenu.classList.remove('show');
      }
    });

    // Export to CSV
    exportBtn.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      if (transactions.length === 0) {
        alert("No transactions to export.");
        return;
      }

      let csvContent = "Date,Description,Type,Amount\n";
      transactions.forEach(tx => {
        // Escape description to handle commas inside text safely
        const safeDesc = `"${tx.description.replace(/"/g, '""')}"`;
        const row = `${tx.date},${safeDesc},${tx.type},${tx.amount}`;
        csvContent += row + "\n";
      });

      if (window.Android && window.Android.saveCSV) {
          window.Android.saveCSV(csvContent);
      } else {
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `spending_export_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
      }
    });

    // Trigger file input for Import
    importBtn.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      fileInput.click();
    });

    // Handle CSV file selection & parsing
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const text = event.target.result;
        const rows = text.split(/\r?\n/); // Handle windows or unix line endings

        let importedCount = 0;
        let newTransactions = [];

        // Start from 1 to skip header row
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i].trim();
          if (!row) continue;

          // Custom parser to handle commas within quotes
          const cols = [];
          let currentStr = '';
          let inQuotes = false;

          for (let char of row) {
            if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              cols.push(currentStr);
              currentStr = '';
            } else {
              currentStr += char;
            }
          }
          cols.push(currentStr); // push last column

          if (cols.length >= 4) {
            const [date, desc, type, amount] = cols;

            if (!isNaN(parseFloat(amount))) {
              newTransactions.push({
                date: date,
                description: desc,
                type: type.toLowerCase(),
                amount: parseFloat(amount)
              });
              importedCount++;
            }
          }
        }

        if (importedCount > 0) {
          transactions = transactions.concat(newTransactions);
          saveTransactions();
          renderTransactions();
          updateSummary();
          alert(`Successfully imported ${importedCount} transactions!`);
        } else {
          alert("Failed to parse CSV. Make sure it matches the exported format.");
        }

        // Reset input so the same file can be selected again if needed
        fileInput.value = '';
      };

      reader.readAsText(file);
    });

    // --- View Switching Logic ---
    function startApp() {
      document.getElementById('landing-view').classList.remove('active');
      document.getElementById('tracker-view').classList.add('active');
    }

    function goHome() {
      document.getElementById('tracker-view').classList.remove('active');
      document.getElementById('landing-view').classList.add('active');
    }

    // Initialize the app
    document.getElementById('date').valueAsDate = new Date();
    renderTransactions();
    updateSummary();

</script>
</body>
</html>
